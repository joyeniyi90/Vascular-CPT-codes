let S={v:"p",q:"",cat:"All",sub:"All",sort:"code",xc:null,xm:null,
  items:[],bq:"",bcat:"All",notes:"",mpFor:null};

function subs(cat){
  if(cat==="All")return["All"];
  return["All",...new Set(CPT.filter(d=>d.cat===cat).map(d=>d.sub))];
}
function filt(){
  let r=CPT;
  if(S.cat!=="All")r=r.filter(d=>d.cat===S.cat);
  if(S.sub!=="All")r=r.filter(d=>d.sub===S.sub);
  if(S.q){const q=S.q.toLowerCase();r=r.filter(d=>d.code.includes(q)||d.desc.toLowerCase().includes(q)||d.sub.toLowerCase().includes(q)||(d.notes&&d.notes.toLowerCase().includes(q)));}
  return[...r].sort((a,b)=>S.sort==="wrvu"?b.wrvu-a.wrvu:S.sort==="alpha"?a.desc.localeCompare(b.desc):a.code.localeCompare(b.code));
}
function bfilt(){
  let r=CPT;
  if(S.bcat!=="All")r=r.filter(d=>d.cat===S.bcat);
  if(S.bq){const q=S.bq.toLowerCase();r=r.filter(d=>d.code.includes(q)||d.desc.toLowerCase().includes(q)||d.sub.toLowerCase().includes(q));}
  return r.slice(0,50);
}
function tot(){
  return S.items.reduce((s,it,i)=>{
    const ia=it.notes&&it.notes.toLowerCase().includes("add-on");
    const m50=it.mods.includes("50");
    let b=it.wrvu*it.qty*(m50?1.5:1);
    if(!ia&&i>0)b*=0.5;
    return s+b;
  },0);
}

    if(S.v===v)el.className+=" "+(v==="b"?"ab":v==="m"?"am":"ap");
    else if(v==="b"&&S.items.length>0)el.className+=" hi";
    const ob=el.querySelector(".bdg");if(ob)ob.remove();
    if(v==="b"&&S.items.length>0){const b=document.createElement("span");b.className="bdg";b.textContent=S.items.length;el.appendChild(b);}
  });

  const fa=document.getElementById("fa");
  fa.style.display=S.v==="p"?"block":"none";
  if(S.v==="p"){
    const cp=document.getElementById("cp");cp.innerHTML="";
    CATS.forEach(cat=>{
      const b=document.createElement("button");b.className="pill";b.textContent=cat;
      const c=cf(cat);
      if(S.cat===cat){b.style.borderColor=c;b.style.background=c+"20";b.style.color=c;}
      b.onclick=()=>{S.cat=cat;S.sub="All";render();};cp.appendChild(b);
    });
    const sc=subs(S.cat),sp=document.getElementById("sp");
    if(sc.length>1){
      sp.style.display="flex";sp.innerHTML="";
      sc.forEach(s=>{
        const b=document.createElement("button");b.className="pill";b.textContent=s;
        if(S.sub===s){b.style.borderColor="#38bdf8";b.style.background="#38bdf820";b.style.color="#38bdf8";}
        b.onclick=()=>{S.sub=s;render();};sp.appendChild(b);
      });
    }else sp.style.display="none";
    ["code","wrvu","alpha"].forEach(k=>{
      document.getElementById(k==="code"?"sc":k==="wrvu"?"sw":"sa").className="sb"+(S.sort===k?" on":"");
    });
  }

  const c=document.getElementById("con");
  if(S.v==="p")rP(c,f);
  else if(S.v==="m")rM(c);
  else rB(c);
}

function rP(c,items){
  if(!items.length){c.innerHTML=`<div class="empty">No codes found for "${S.q}"</div>`;return;}
  c.innerHTML="";
  items.forEach(it=>{
    const col=cf(it.cat),exp=S.xc===(it.code+it.sub);
    const card=document.createElement("div");
    card.className="cc"+(exp?" ex":"");
    if(exp)card.style.borderColor=col;
    card.innerHTML=`<div class="ct"><div class="cl"><div class="cm"><span class="cb" style="background:${col}20;color:${col}">${it.code}</span><span class="csl">${it.sub}</span></div><div class="cd">${it.desc}</div></div><div class="cr"><div class="wv">${it.wrvu.toFixed(2)}</div><div class="wl">wRVU</div></div></div>${exp?`<div class="cdet" style="border-top-color:${col}30"><div class="dr"><span>Category</span><span style="color:${col}">${it.cat}</span></div><div class="dr"><span>CPT Code</span><span>${it.code}</span></div><div class="dr"><span>wRVU 2026</span><span class="dh">${it.wrvu.toFixed(2)}</span></div>${it.notes?`<div class="dr"><span>Notes</span><span style="color:#94a3b8;font-size:10px;max-width:190px;text-align:right">${it.notes}</span></div>`:""}<div class="disc">&#9888; Verify wRVUs annually. Values estimated 2026 based on CMS/MGMA data.</div></div>`:""}`;
    card.onclick=()=>{S.xc=exp?null:(it.code+it.sub);render();};
    c.appendChild(card);
  });
}

function rM(c){
  c.innerHTML="";
  const q=S.q.toLowerCase();
  const mods=q?MODS.filter(m=>m.code.toLowerCase().includes(q)||m.name.toLowerCase().includes(q)||m.use.toLowerCase().includes(q)||(m.ex&&m.ex.toLowerCase().includes(q))):MODS;
  mods.forEach(mod=>{
    const exp=S.xm===mod.code;
    const d=document.createElement("div");
    d.className="mc"+(exp?" ex":"");
    d.innerHTML=`<span class="mb">-${mod.code}</span><div class="mn">${mod.name}</div><div class="mu">${mod.use}</div>${exp&&mod.ex?`<div class="mex"><span class="mxl">Example: </span>${mod.ex}</div>`:""}`;
    d.onclick=()=>{S.xm=exp?null:mod.code;render();};
    c.appendChild(d);
  });
}

function rB(c){
  const t=tot(),est=(t*68.87).toFixed(0);
  let h=`<div id="bsum"><div><div class="btl">Case Total</div><div class="btv">${t.toFixed(2)}</div><div class="bcn">${S.items.length} code${S.items.length!==1?"s":""} · wRVU</div></div><div style="text-align:right"><div class="bel">Est. collections*</div><div class="bev">$${est}</div><div class="bcf">@ $68.87 CF</div>${S.items.length>1?`<div class="brd">&#9889; -51 reduction applied</div>`:""}</div></div>`;
  if(!S.items.length){
    h+=`<div class="bemp"><div class="bei">+</div><div class="bet">Add codes below to build your case</div><div class="bes">Primary code first, then add-ons</div></div>`;
  }else{
    S.items.forEach((it,i)=>{
      const ia=it.notes&&it.notes.toLowerCase().includes("add-on");
      const m50=it.mods.includes("50");
      const eff=(ia?it.wrvu*it.qty:it.wrvu*it.qty*(i>0?0.5:1))*(m50?1.5:1);
      const mpo=S.mpFor===it.uid;
      h+=`<div class="ci ${i===0?"p":"s"}"><div class="cit"><div style="flex:1"><div class="cts">${i===0?`<span class="tp">PRIMARY</span>`:""}${ia?`<span class="ta">ADD-ON</span>`:""}<span class="cb" style="background:${cf(it.cat)}20;color:${cf(it.cat)};font-size:13px;font-weight:700;padding:1px 6px;border-radius:4px">${it.code}</span>${it.mods.map(m=>`<span class="tm">-${m}</span>`).join("")}</div><div class="cdx">${it.desc}</div></div><div class="cw ${i>0&&!ia?"r":"f"}">${eff.toFixed(2)}${i>0&&!ia?`<div class="cws">50% reduct.</div>`:""}<div class="cwb">base: ${it.wrvu.toFixed(2)}</div></div></div><div class="ccc"><div class="qc"><button class="qb" onclick="cq('${it.uid}',-1)">&#8722;</button><span class="qv">${it.qty}</span><button class="qb" onclick="cq('${it.uid}',1)">+</button></div><button class="mt" onclick="tmp('${it.uid}')" style="background:${mpo?"#8b5cf620":"transparent"};color:${mpo?"#a78bfa":"#475569"};border:1px solid ${mpo?"#8b5cf6":"#1e293b"}">+MOD</button><div style="flex:1"></div><button class="rb" onclick="ri('${it.uid}')">&#10005;</button></div>${mpo?`<div class="mp"><div class="mpl">MODIFIERS</div><div class="mpg">${SMODS.map(mc=>`<button class="mch ${it.mods.includes(mc)?"on":"of"}" onclick="tm('${it.uid}','${mc}')">-${mc}</button>`).join("")}</div>${it.mods.length?`<div class="msl">${it.mods.map(mc=>ML[mc]?`<div class="msi"><span class="msc">-${mc}</span> · ${ML[mc].name}</div>`:"").join("")}</div>`:""}</div>`:""}</div>`;
    });
    h+=`<textarea class="cn" rows="2" placeholder="Case notes (patient, date, diagnosis, ICD-10...)" oninput="S.notes=this.value">${S.notes}</textarea>`;
    h+=`<button class="clr" onclick="clrc()">&#10005; CLEAR CASE</button>`;
  }
  h+=`<div id="acp"><div id="act">ADD CODE TO CASE</div><div class="pr" style="margin-bottom:8px">`;
  CATS.forEach(cat=>{const c2=cf(cat),a=S.bcat===cat;h+=`<button class="pill" onclick="sbc('${cat}')" style="${a?`border-color:${c2};background:${c2}20;color:${c2}`:""}">${cat}</button>`;});
  h+=`</div><div class="sw" style="margin-bottom:8px"><span class="si">&#9906;</span><input type="search" placeholder="Search code or procedure..." value="${S.bq.replace(/"/g,'&quot;')}" oninput="ubq(this.value)" autocomplete="off" autocorrect="off" spellcheck="false" style="width:100%;background:#111827;border:1px solid #1e293b;border-radius:8px;padding:9px 12px 9px 34px;color:#e2e8f0;font-size:12px;outline:none;box-sizing:border-box;font-family:inherit"></div><div id="ares">`;
  bfilt().forEach(it=>{
    const ia=it.notes&&it.notes.toLowerCase().includes("add-on");
    const esc=it.sub.replace(/'/g,"\\'");
    h+=`<div class="ai" onclick="atc('${it.code}','${esc}')"><div class="ail"><div class="aic"><span class="cb" style="background:${cf(it.cat)}20;color:${cf(it.cat)};font-size:12px;font-weight:700;padding:1px 6px;border-radius:4px">${it.code}</span>${ia?`<span class="ta">ADD-ON</span>`:""}</div><div class="aid">${it.desc}</div></div><div class="air"><div class="aw">${it.wrvu.toFixed(2)}</div><div class="awl">wRVU</div></div></div>`;
  });
  h+=`</div></div><div class="bdi">* Est. at 2026 CF $68.87. -51 reduction (50%) on non-add-on secondary codes. Modifier -50 bilateral adds 50%. Actual reimbursement varies by payer.</div>`;
  c.innerHTML=h;
}

function sv(v){S.v=v;S.q="";document.getElementById("srch").value="";render();}
function ss(s){S.sort=s;render();}
function atc(code,sub){const it=CPT.find(d=>d.code===code&&d.sub===sub);if(!it)return;S.items.push({...it,mods:[],qty:1,uid:Date.now()+Math.random().toString(36).slice(2)});S.bq="";render();}
function ri(uid){S.items=S.items.filter(i=>i.uid!==uid);S.mpFor=null;render();}
function cq(uid,d){S.items=S.items.map(i=>i.uid===uid?{...i,qty:Math.max(1,i.qty+d)}:i);render();}
function tmp(uid){S.mpFor=S.mpFor===uid?null:uid;render();}
function tm(uid,mod){S.items=S.items.map(i=>{if(i.uid!==uid)return i;const h=i.mods.includes(mod);return{...i,mods:h?i.mods.filter(x=>x!==mod):[...i.mods,mod]};});render();}
function clrc(){S.items=[];S.notes="";S.mpFor=null;render();}
function sbc(cat){S.bcat=cat;render();}
function ubq(v){S.bq=v;render();}

document.getElementById("srch").addEventListener("input",function(){S.q=this.value;S.xc=null;render();});
render();
</script>
</body>
</html>
