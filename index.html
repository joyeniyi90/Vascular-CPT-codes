// Build a fast lookup set: "code1|code2" -> {modInd, explanation}
const NCCI_MAP={};
NCCI_PTP.forEach(([c1,c2,mi,ex])=>{
  NCCI_MAP[c1+"|"+c2]={mi,ex,c1,c2};
  // Also index by c2|c1 for bidirectional detection (same edit, direction noted in explanation)
  NCCI_MAP[c2+"|"+c1]={mi,ex,c1,c2,reversed:true};
});

// ── State ────────────────────────────────────────────────────────────────────

  v:"p",q:"",cat:"All",sub:"All",sort:"code",

  items:[],bq:"",bcat:"All",bsub:"All",

// ── Log (localStorage) ───────────────────────────────────────────────────────
function getLog(){try{return JSON.parse(localStorage.getItem("VCR2026_log")||"[]");}catch(e){return[];}}
function saveLog(log){try{localStorage.setItem("VCR2026_log",JSON.stringify(log));}catch(e){}}

// ── Helpers ──────────────────────────────────────────────────────────────────
function subs(cat){
  if(cat==="All")return["All"];
  return["All",...new Set(CPT.filter(d=>d.cat===cat).map(d=>d.sub))];
}
function bsubs(cat){
  if(cat==="All")return["All"];
  return["All",...new Set(CPT.filter(d=>d.cat===cat).map(d=>d.sub))];
}
function filt(){
  let r=CPT;
  if(S.cat!=="All")r=r.filter(d=>d.cat===S.cat);
  if(S.sub!=="All")r=r.filter(d=>d.sub===S.sub);
  if(S.q){const q=S.q.toLowerCase();r=r.filter(d=>d.code.includes(q)||d.desc.toLowerCase().includes(q)||d.sub.toLowerCase().includes(q)||(d.notes&&d.notes.toLowerCase().includes(q)));}
  return[...r].sort((a,b)=>S.sort==="wrvu"?b.wrvu-a.wrvu:S.sort==="alpha"?a.desc.localeCompare(b.desc):a.code.localeCompare(b.code));
}
function bfilt(){
  let r=CPT;
  if(S.bcat!=="All")r=r.filter(d=>d.cat===S.bcat);
  if(S.bsub!=="All")r=r.filter(d=>d.sub===S.bsub);
  if(S.bq){const q=S.bq.toLowerCase();r=r.filter(d=>d.code.includes(q)||d.desc.toLowerCase().includes(q)||d.sub.toLowerCase().includes(q));}
  return r.slice(0,60);
}
function tot(){
  return S.items.reduce((s,it,i)=>{
    const ia=it.notes&&it.notes.toLowerCase().includes("add-on");
    const m50=it.mods.includes("50");
    let b=it.wrvu*it.qty*(m50?1.5:1);
    if(!ia&&i>0)b*=0.5;
    return s+b;
  },0);
}
function fmtDate(iso){
  const d=new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"}).toUpperCase();
}

// ── Render ───────────────────────────────────────────────────────────────────
function render(){
  const f=filt();
  const log=getLog();
  document.getElementById("rcount").textContent=
    S.v==="p"?f.length:S.v==="m"?MODS.length:S.v==="b"?S.items.length:log.length;
  document.getElementById("rbsub").textContent=
    S.v==="p"?"results":S.v==="m"?"modifiers":S.v==="b"?"in case":"saved";
  document.getElementById("hsub").textContent="2026 · "+CPT.length+" codes · "+MODS.length+" modifiers · CMS verified";

  ["p","m","b","l"].forEach(v=>{
    const el=document.getElementById("t"+v);
    el.className="tab";
    if(S.v===v)el.className+=" "+(v==="b"?"ab":v==="m"?"am":v==="l"?"al":"ap");
    else if(v==="b"&&S.items.length>0)el.className+=" hi";
    const ob=el.querySelector(".bdg");if(ob)ob.remove();
    if(v==="b"&&S.items.length>0){const b=document.createElement("span");b.className="bdg";b.textContent=S.items.length;el.appendChild(b);}
  });

  const fa=document.getElementById("fa");
  fa.style.display=S.v==="p"?"block":"none";

  if(S.v==="p"){
    // Category pills
    const cp=document.getElementById("cp");cp.innerHTML="";
    CATS.forEach(cat=>{
      const b=document.createElement("button");b.className="pill"+(S.cat===cat?" active":"");
      b.textContent=cat==="All"?"All ("+CPT.length+")":cat;
      const c=cf(cat);
      if(S.cat===cat){b.style.borderColor=c;b.style.background=c;b.style.color="#fff";}
      else{b.style.borderColor=c+"50";b.style.color=c;}
      b.onclick=()=>{S.cat=cat;S.sub="All";render();};cp.appendChild(b);
    });
    // Subcategory pills
    const sc2=subs(S.cat),sp=document.getElementById("sp"),sfgrp=document.getElementById("sfgrp");
    if(sc2.length>1){
      sfgrp.style.display="block";sp.innerHTML="";
      const col=cf(S.cat);
      sc2.forEach(s=>{
        const b=document.createElement("button");b.className="pill"+(S.sub===s?" active":"");
        b.textContent=s;
        if(S.sub===s){b.style.borderColor=col;b.style.background=col;b.style.color="#fff";}
        else{b.style.borderColor="#38bdf840";b.style.color="#38bdf8";}
        b.onclick=()=>{S.sub=s;render();};sp.appendChild(b);
      });
    }else{sfgrp.style.display="none";}
    ["code","wrvu","alpha"].forEach(k=>{document.getElementById(k==="code"?"sc":k==="wrvu"?"sw2":"sa").className="sb"+(S.sort===k?" on":"");});
  }

  const c=document.getElementById("con");
  if(S.v==="p")rP(c,f);
  else if(S.v==="m")rM(c);
  else if(S.v==="b")rB(c);
  else rL(c);
}

// ── Render: Modifiers ────────────────────────────────────────────────────────
function rM(c){
  c.innerHTML="";
  const q=S.q.toLowerCase();
  const mods=q?MODS.filter(m=>m.code.toLowerCase().includes(q)||m.name.toLowerCase().includes(q)||m.use.toLowerCase().includes(q)||(m.ex&&m.ex.toLowerCase().includes(q))):MODS;
  mods.forEach(mod=>{
    const exp=S.xm===mod.code;
    const d=document.createElement("div");
    d.className="mc"+(exp?" ex":"");
    d.innerHTML='<span class="mb">-'+mod.code+'</span><div class="mn">'+mod.name+'</div><div class="mu">'+mod.use+'</div>'
      +(exp&&mod.ex?'<div class="me"><span class="mel">Example: </span>'+mod.ex+'</div>':"");
    d.onclick=()=>{S.xm=exp?null:mod.code;render();};
    c.appendChild(d);
  });
}

// ── NCCI Check ───────────────────────────────────────────────────────────────
function getNcciAlerts(items){
  const alerts=[];
  const seen=new Set();
  for(let i=0;i<items.length;i++){
    for(let j=i+1;j<items.length;j++){
      const a=items[i].code, b=items[j].code;
      const key=a+"|"+b, rkey=b+"|"+a;
      const hit=NCCI_MAP[key]||NCCI_MAP[rkey];
      if(hit&&!seen.has(hit.c1+"|"+hit.c2)){
        seen.add(hit.c1+"|"+hit.c2);
        alerts.push({...hit, codeA:a, codeB:b});
      }
    }
  }
  return alerts;
}

  c.innerHTML=h;
}

// ── Render: Log ──────────────────────────────────────────────────────────────
function rL(c){
  const log=getLog();
  if(!log.length){
    c.innerHTML='<div class="empty" style="margin-top:32px">&#128467;<br><br>No cases logged yet.<br><span style="font-size:11px;color:#334155">Build a case and tap SAVE TO LOG.</span></div>';
    return;
  }

  // Group by date
  const byDate={};
  log.forEach(entry=>{
    if(!byDate[entry.date])byDate[entry.date]=[];
    byDate[entry.date].push(entry);
  });
  const dates=Object.keys(byDate).sort().reverse();

  const totalWRVU=log.reduce((s,e)=>s+e.totalWRVU,0);
  const totalEst=log.reduce((s,e)=>s+e.estCollections,0);

  let h='<div class="lhdr"><div><div class="lttl">CASE LOG</div>'
    +'<div class="lcnt">'+log.length+' case'+(log.length!==1?"s":"")
    +' · '+totalWRVU.toFixed(1)+' wRVU total'
    +' · $'+Math.round(totalEst).toLocaleString()+' est.</div></div>'
    +'<button class="expbtn" onclick="exportLog()">&#8681; CSV</button>'
    +'</div>';

  dates.forEach(date=>{
    const dayEntries=byDate[date];
    const dayWRVU=dayEntries.reduce((s,e)=>s+e.totalWRVU,0);
    h+='<div class="ldh">'+fmtDate(date)+' — '+dayWRVU.toFixed(1)+' wRVU</div>';
    dayEntries.slice().reverse().forEach(entry=>{
      const exp=S.xl===entry.id;
      h+='<div class="lc'+(exp?" ex":"")+'" onclick="toggleLog(\''+entry.id+'\')">'
        +'<div class="lct"><div class="lcl">'
        +'<div class="lctime">'+entry.time+'</div>'
        +'<div class="lcnotes">'+(entry.notes||'(no notes)')+'</div>'
        +'<div class="lccodes">'
        +entry.items.slice(0,5).map(it=>'<span class="lccode" style="background:'+cf(it.cat)+'20;color:'+cf(it.cat)+'">'+it.code+'</span>').join("")
        +(entry.items.length>5?'<span style="font-size:9px;color:#475569">+'+( entry.items.length-5)+' more</span>':"")
        +'</div></div>'
        +'<div class="lcr"><div class="lcw">'+entry.totalWRVU.toFixed(2)+'</div>'
        +'<div style="font-size:8px;color:#475569">wRVU</div>'
        +'<div class="lce">$'+Math.round(entry.estCollections).toLocaleString()+'</div>'
        +'</div></div>';

      if(exp){
        h+='<div class="lcdet">';
        entry.items.forEach((it,i)=>{
          h+='<div class="lcrow">'
            +'<span>'+(i===0?"[PRIMARY] ":"[+"+(i+1)+"] ")+'<strong style="color:'+cf(it.cat)+'">'+it.code+'</strong> '+it.desc+'</span>'
            +'<span>'+it.wrvu.toFixed(2)+(it.mods.length?" [-"+it.mods.join("-")+"]":"")+'</span>'
            +'</div>';
        });
        if(entry.notes){
          h+='<div class="lcnote">'+entry.notes+'</div>';
        }
        h+='<button class="lcdel" onclick="delLog(event,\''+entry.id+'\')">&#10005; Delete Entry</button>';
        h+='</div>';
      }
      h+='</div>';
    });
  });

  c.innerHTML=h;
}

// ── Actions ──────────────────────────────────────────────────────────────────
function sv(v){S.v=v;S.q="";document.getElementById("srch").value="";render();}
function ss(s){S.sort=s;render();}
function atc(code,sub){const it=CPT.find(d=>d.code===code&&d.sub===sub);if(!it)return;S.items.push({...it,mods:[],qty:1,uid:Date.now()+Math.random().toString(36).slice(2)});S.bq="";render();}
function ri(uid){S.items=S.items.filter(i=>i.uid!==uid);S.mpFor=null;render();}
function cq(uid,d){S.items=S.items.map(i=>i.uid===uid?{...i,qty:Math.max(1,i.qty+d)}:i);render();}
function tmp(uid){S.mpFor=S.mpFor===uid?null:uid;render();}
function tm(uid,mod){S.items=S.items.map(i=>{if(i.uid!==uid)return i;const h=i.mods.includes(mod);return{...i,mods:h?i.mods.filter(x=>x!==mod):[...i.mods,mod]};});render();}
function clrc(){S.items=[];S.notes="";S.mpFor=null;render();}
function sbc(cat){S.bcat=cat;S.bsub="All";render();}
function sbsub(s){S.bsub=s;render();}
function ubq(v){S.bq=v;render();}
function toggleLog(id){S.xl=S.xl===id?null:id;render();}

function saveCase(){
  if(!S.items.length)return;
  const now=new Date();
  const pad=n=>String(n).padStart(2,"0");
  const date=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
  const time=pad(now.getHours())+":"+pad(now.getMinutes());
  const t=tot();
  const entry={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2),
    date,time,
    notes:S.notes,
    items:S.items.map(it=>({code:it.code,desc:it.desc,cat:it.cat,sub:it.sub,wrvu:it.wrvu,qty:it.qty,mods:it.mods})),
    totalWRVU:parseFloat(t.toFixed(2)),
    estCollections:parseFloat((t*68.87).toFixed(2))
  };
  const log=getLog();
  log.push(entry);
  saveLog(log);
  showToast("✓ Case saved to log");
}

function delLog(e,id){
  e.stopPropagation();
  const log=getLog().filter(x=>x.id!==id);
  saveLog(log);
  S.xl=null;
  render();
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

function exportLog(){
  const log=getLog();
  if(!log.length){showToast("No cases to export");return;}
  const rows=[["Date","Time","Notes","Position","CPT Code","Description","Category","Subcategory","wRVU","Qty","Modifiers","Line wRVU","Case Total wRVU","Est. Collections ($)"]];
  log.forEach(entry=>{
    entry.items.forEach((it,i)=>{
      const ia=it.notes&&(it.notes||"").toLowerCase().includes("add-on");
      const m50=(it.mods||[]).includes("50");
      const eff=(ia?it.wrvu*it.qty:it.wrvu*it.qty*(i>0?0.5:1))*(m50?1.5:1);
      rows.push([
        entry.date,
        entry.time,
        '"'+(entry.notes||"").replace(/"/g,'""')+'"',
        i===0?"Primary":"Secondary",
        it.code,
        '"'+it.desc.replace(/"/g,'""')+'"',
        it.cat,
        it.sub,
        it.wrvu.toFixed(2),
        it.qty,
        (it.mods||[]).join(";"),
        eff.toFixed(2),
        i===0?entry.totalWRVU.toFixed(2):"",
        i===0?entry.estCollections.toFixed(2):""
      ]);
    });
  });
  const csv=rows.map(r=>r.join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  const now=new Date();
  a.download="VascularCPT_Log_"+now.getFullYear()+String(now.getMonth()+1).padStart(2,"0")+String(now.getDate()).padStart(2,"0")+".csv";
  a.click();
  URL.revokeObjectURL(url);
  showToast("CSV downloaded");
}

document.getElementById("srch").addEventListener("input",function(){S.q=this.value;S.xc=null;render();});
render();
</script>
