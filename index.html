  .tabs{display:flex;gap:6px;margin-bottom:10px;}
  .tab{flex:1;padding:7px 0;border-radius:6px;border:none;font-size:10px;font-weight:700;letter-spacing:.5px;cursor:pointer;text-transform:uppercase;font-family:inherit;position:relative;}
  .tab.active-proc{background:#0ea5e9;color:#fff;}
  .tab.active-mod{background:#0ea5e9;color:#fff;}
  .tab.active-build{background:#b45309;color:#fff;}
  .tab.inactive{background:#111827;color:#64748b;}
  .tab.has-items{border:1px solid #f59e0b60;color:#f59e0b;}
  .tab-badge{position:absolute;top:-4px;right:-4px;background:#f59e0b;color:#000;border-radius:50%;width:14px;height:14px;font-size:8px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .pill-row{overflow-x:auto;display:flex;gap:5px;padding-bottom:4px;scrollbar-width:none;white-space:nowrap;}
  .pill{flex-shrink:0;padding:3px 9px;border-radius:20px;font-size:9px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid #1e293b;background:transparent;color:#64748b;}
  .sort-row{display:flex;gap:6px;margin-top:8px;align-items:center;}
  .sort-btn{padding:3px 8px;border-radius:4px;border:none;font-size:10px;cursor:pointer;font-family:inherit;font-weight:700;background:transparent;color:#475569;}
  .sort-btn.active{background:#1e3a5f;color:#38bdf8;}
  .content{padding:8px 12px;}
  .card{border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border:1px solid #1e293b;background:#111827;}
  .card.expanded{background:#0d1f3a;}
  .card-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .code-chip{font-size:13px;font-weight:700;padding:1px 6px;border-radius:4px;}
  .subcat{font-size:9px;color:#475569;letter-spacing:1px;text-transform:uppercase;}
  .desc{font-size:12px;color:#cbd5e1;line-height:1.4;margin-top:3px;}
  .wrvu-val{font-size:16px;font-weight:700;color:#38bdf8;}
  .wrvu-lbl{font-size:9px;color:#475569;}
  .detail{margin-top:12px;padding-top:12px;border-top:1px solid #1e3a5f;display:grid;gap:7px;}
  .detail-row{display:flex;justify-content:space-between;font-size:11px;}
  .detail-lbl{color:#475569;}
  .detail-val{color:#cbd5e1;}
  .detail-val.hi{color:#38bdf8;font-weight:700;}
  .warn-box{margin-top:4px;background:#0a1628;border-radius:6px;padding:8px 10px;font-size:10px;color:#64748b;}
  /* Modifiers */
  .mod-card{border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border:1px solid #1e293b;background:#111827;}
  .mod-card.expanded{background:#0d1f3a;border-color:#38bdf8;}
  .mod-chip{font-size:13px;font-weight:700;padding:1px 8px;border-radius:4px;background:#38bdf820;color:#38bdf8;}
  .mod-name{font-size:12px;color:#cbd5e1;font-weight:600;margin-top:4px;}
  .mod-use{font-size:11px;color:#64748b;margin-top:3px;line-height:1.4;}
  .mod-example{background:#0a1628;border-radius:6px;padding:8px 10px;font-size:10px;color:#94a3b8;margin-top:10px;}
  /* Builder */
  .summary-bar{background:linear-gradient(135deg,#0d1f3a,#0a1628);border:1px solid #1e3a5f;border-radius:12px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .total-wrvu{font-size:32px;font-weight:700;color:#38bdf8;line-height:1;}
  .est-col{font-size:16px;font-weight:700;color:#10b981;}
  .empty-state{text-align:center;padding:32px 16px;border:1px dashed #1e293b;border-radius:10px;margin-bottom:12px;}
  .case-item{background:#111827;border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .case-item.primary{border:1px solid #0ea5e940;}
  .case-item.secondary{border:1px solid #1e293b;}
  .badge-primary{font-size:8px;background:#0ea5e920;color:#38bdf8;padding:1px 5px;border-radius:3px;font-weight:700;}
  .badge-addon{font-size:8px;background:#f59e0b20;color:#f59e0b;padding:1px 5px;border-radius:3px;font-weight:700;}
  .badge-mod{font-size:9px;background:#8b5cf620;color:#a78bfa;padding:1px 5px;border-radius:3px;font-weight:700;}
  .ctrl-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;}
  .qty-ctrl{display:flex;align-items:center;gap:4px;background:#0a0f1a;border-radius:6px;padding:2px 6px;}
  .qty-btn{background:none;border:none;color:#64748b;cursor:pointer;font-size:16px;padding:0 2px;font-family:inherit;border-radius:4px;}
  .qty-val{font-size:11px;color:#e2e8f0;min-width:16px;text-align:center;}
  .btn-mod-pick{padding:3px 8px;border-radius:6px;border:1px solid #1e293b;background:transparent;color:#475569;font-size:9px;cursor:pointer;font-family:inherit;font-weight:700;}

  .mod-picker{margin-top:8px;padding:8px;background:#0a0f1a;border-radius:8px;}
  .mod-btns{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
  .mod-toggle{padding:3px 8px;border-radius:4px;border:1px solid #1e293b;background:transparent;color:#475569;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;}
  .mod-toggle.on{border-color:#8b5cf6;background:#8b5cf620;color:#a78bfa;}
  .case-notes{width:100%;background:#111827;border:1px solid #1e293b;border-radius:8px;padding:8px 10px;color:#94a3b8;font-size:11px;outline:none;resize:none;margin-bottom:8px;}
  .btn-clear{width:100%;padding:8px;border-radius:8px;border:1px solid #3f1212;background:transparent;color:#ef4444;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:16px;letter-spacing:1px;}
  .add-panel{background:#0d1f3a;border:1px solid #1e3a5f;border-radius:12px;padding:12px;}
  .panel-title{font-size:10px;color:#38bdf8;font-weight:700;letter-spacing:2px;margin-bottom:8px;}
  .add-results{max-height:260px;overflow-y:auto;}
  .add-card{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;margin-bottom:4px;background:#111827;border:1px solid #1e293b;cursor:pointer;}
  .disclaimer{font-size:9px;color:#334155;text-align:center;margin-top:12px;line-height:1.5;}
  .footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#0a0f1a;border-top:1px solid #1e293b;padding:7px 16px;font-size:9px;color:#334155;text-align:center;}
  .no-results{text-align:center;color:#475569;padding:40px 20px;font-size:13px;}
  .reduction-note{font-size:8px;color:#475569;}

// ─── STATE ───────────────────────────────────────────────────────────────────
let state = {
  tab: 'procedures',
  search: '',
  category: 'All',
  subcategory: 'All',
  sort: 'code',
  expandedCode: null,
  expandedMod: null,
  caseItems: [],
  caseNotes: '',
  modPickerUid: null,
  builderSearch: '',
  builderCategory: 'All',
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function colorFor(cat){ return CATEGORY_COLORS[cat]||'#94a3b8'; }
function isAddon(item){ return item.notes && item.notes.toLowerCase().includes('add-on'); }
function uid(){ return Math.random().toString(36).slice(2); }

function getCategories(){
  return ['All',...Object.keys(CATEGORY_COLORS)];
}
function getSubcategories(cat){
  if(cat==='All') return ['All'];
  const s=[...new Set(CPT_DATA.filter(d=>d.category===cat).map(d=>d.subcategory))];
  return ['All',...s];
}
function getFiltered(){
  let data=[...CPT_DATA];
  if(state.category!=='All') data=data.filter(d=>d.category===state.category);
  if(state.subcategory!=='All') data=data.filter(d=>d.subcategory===state.subcategory);
  if(state.search.trim()){
    const q=state.search.toLowerCase();
    data=data.filter(d=>d.code.includes(q)||d.description.toLowerCase().includes(q)||d.subcategory.toLowerCase().includes(q)||d.notes.toLowerCase().includes(q));
  }
  data.sort((a,b)=>{
    if(state.sort==='wrvu') return b.wrvu-a.wrvu;
    if(state.sort==='desc') return a.description.localeCompare(b.description);
    return a.code.localeCompare(b.code);
  });
  return data;
}
function getBuilderFiltered(){
  let data=[...CPT_DATA];
  if(state.builderCategory!=='All') data=data.filter(d=>d.category===state.builderCategory);
  if(state.builderSearch.trim()){
    const q=state.builderSearch.toLowerCase();
    data=data.filter(d=>d.code.includes(q)||d.description.toLowerCase().includes(q)||d.subcategory.toLowerCase().includes(q));
  }
  return data.slice(0,40);
}
function calcTotal(){
  return state.caseItems.reduce((sum,item,idx)=>{
    const addon=isAddon(item);
    const mod50=item.modifiers.includes('50');
    let base=item.wrvu*item.qty*(mod50?1.5:1);
    if(!addon&&idx>0) base*=0.5;
    return sum+base;
  },0);
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render(){
  const content=document.getElementById('content');
  updateHeader();
  if(state.tab==='procedures') renderProcedures(content);
  else if(state.tab==='modifiers') renderModifiers(content);
  else renderBuilder(content);
}

function updateHeader(){
  // Tab styling
  const tabs=['proc','mod','build'];
  const tabIds=['procedures','modifiers','builder'];
  tabs.forEach((t,i)=>{
    const el=document.getElementById('tab-'+t);
    el.className='tab';
    if(state.tab===tabIds[i]){
      el.className+= i===2?' active-build':' active-proc';
    } else {
      el.className+=' inactive';
      if(i===2&&state.caseItems.length>0) el.className+=' has-items';
    }
    // badge
    const existing=el.querySelector('.tab-badge');
    if(existing) existing.remove();
    if(i===2&&state.caseItems.length>0){
      const b=document.createElement('span');
      b.className='tab-badge';
      b.textContent=state.caseItems.length;
      el.appendChild(b);
    }
  });

  // Proc filters visibility
  const pf=document.getElementById('proc-filters');
  pf.style.display=state.tab==='procedures'?'block':'none';

  if(state.tab==='procedures'){
    // Category pills
    const cp=document.getElementById('cat-pills');
    cp.innerHTML='';
    getCategories().forEach(cat=>{
      const b=document.createElement('button');
      b.className='pill';
      b.textContent=cat;
      const active=state.category===cat;
      if(active){ b.style.borderColor=colorFor(cat); b.style.background=colorFor(cat)+'22'; b.style.color=colorFor(cat); }
      b.onclick=()=>{ state.category=cat; state.subcategory='All'; render(); };
      cp.appendChild(b);
    });
    // Sub pills
    const sp=document.getElementById('sub-pills');
    const subs=getSubcategories(state.category);
    if(subs.length>1){
      sp.style.display='flex';
      sp.innerHTML='';
      subs.forEach(sub=>{
        const b=document.createElement('button');
        b.className='pill';
        b.textContent=sub;
        const active=state.subcategory===sub;
        if(active){ b.style.borderColor='#38bdf8'; b.style.background='#38bdf822'; b.style.color='#38bdf8'; }
        b.onclick=()=>{ state.subcategory=sub; render(); };
        sp.appendChild(b);
      });
    } else { sp.style.display='none'; }
    // Sort
    ['code','wrvu','desc'].forEach(s=>{
      const el=document.getElementById('sort-'+s);
      el.className='sort-btn'+(state.sort===s?' active':'');
    });
    // Result count
    const f=getFiltered();
    document.getElementById('result-count').textContent=f.length;
  } else {
    document.getElementById('result-count').textContent='—';
  }
  document.getElementById('total-count').textContent=CPT_DATA.length;
}

function renderProcedures(content){
  const data=getFiltered();
  if(data.length===0){ content.innerHTML=`<div class="no-results">No codes found for "${state.search}"</div>`; return; }
  let html='';
  data.forEach(item=>{
    const color=colorFor(item.category);
    const exp=state.expandedCode===item.code+'|'+item.description;
    html+=`<div class="card${exp?' expanded':''}" onclick="toggleCard('${item.code}','${item.description.replace(/'/g,"\\'")}')">
      <div class="card-row">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span class="code-chip" style="background:${color}22;color:${color}">${item.code}</span>
            <span class="subcat">${item.subcategory}</span>
          </div>
          <div class="desc">${item.description}</div>
        </div>
        <div style="text-align:right;margin-left:12px;flex-shrink:0">
          <div class="wrvu-val">${item.wrvu.toFixed(2)}</div>
          <div class="wrvu-lbl">wRVU</div>
        </div>
      </div>`;
    if(exp){
      html+=`<div class="detail">
        <div class="detail-row"><span class="detail-lbl">Category</span><span class="detail-val" style="color:${color}">${item.category}</span></div>
        <div class="detail-row"><span class="detail-lbl">CPT Code</span><span class="detail-val">${item.code}</span></div>
        <div class="detail-row"><span class="detail-lbl">wRVU (2026)</span><span class="detail-val hi">${item.wrvu.toFixed(2)}</span></div>
        ${item.notes?`<div class="detail-row"><span class="detail-lbl">Notes</span><span class="detail-val" style="font-size:10px;text-align:right;max-width:60%">${item.notes}</span></div>`:''}
        <div class="warn-box">⚠ Verify wRVUs annually with CMS/MGMA. Values estimated for 2026.</div>
      </div>`;
    }
    html+='</div>';
  });
  content.innerHTML=html;
}

function renderModifiers(content){
  const q=state.search.toLowerCase().trim();
  const data=q?MODIFIERS.filter(m=>m.code.toLowerCase().includes(q)||m.name.toLowerCase().includes(q)||m.use.toLowerCase().includes(q)):MODIFIERS;
  let html='';
  data.forEach(mod=>{
    const exp=state.expandedMod===mod.code;
    html+=`<div class="mod-card${exp?' expanded':''}" onclick="toggleMod('${mod.code}')">
      <span class="mod-chip">-${mod.code}</span>
      <div class="mod-name">${mod.name}</div>
      <div class="mod-use">${mod.use}</div>
      ${exp&&mod.example?`<div class="mod-example"><strong style="color:#38bdf8">Example:</strong> ${mod.example}</div>`:''}
    </div>`;
  });
  content.innerHTML=html;
}

function renderBuilder(content){
  const total=calcTotal();
  const estColl=(total*68.87).toFixed(0);
  let html=`<div class="summary-bar">
    <div>
      <div style="font-size:9px;color:#475569;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px">Case Total</div>
      <div class="total-wrvu">${total.toFixed(2)}</div>
      <div style="font-size:10px;color:#475569;margin-top:2px">wRVU · ${state.caseItems.length} code${state.caseItems.length!==1?'s':''}</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:9px;color:#475569;margin-bottom:4px">Est. collections*</div>
      <div class="est-col">$${estColl}</div>
      <div style="font-size:8px;color:#334155;margin-top:2px">@ $68.87 CF</div>
      ${state.caseItems.length>1?'<div style="font-size:8px;color:#f59e0b;margin-top:4px">⚡ -51 reduction applied</div>':''}
    </div>
  </div>`;

  if(state.caseItems.length===0){
    html+=`<div class="empty-state">
      <div style="font-size:28px;color:#1e293b;margin-bottom:8px">＋</div>
      <div style="font-size:12px;color:#475569">Add codes below to build your case</div>
      <div style="font-size:10px;color:#334155;margin-top:4px">Primary code first, then add-ons</div>
    </div>`;
  } else {
    state.caseItems.forEach((item,idx)=>{
      const addon=isAddon(item);
      const mod50=item.modifiers.includes('50');
      const eff=(addon?item.wrvu*item.qty:item.wrvu*item.qty*(idx>0?0.5:1))*(mod50?1.5:1);
      const isPicker=state.modPickerUid===item.uid;
      html+=`<div class="case-item ${idx===0?'primary':'secondary'}">
        <div class="card-row">
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:3px">
              ${idx===0?'<span class="badge-primary">PRIMARY</span>':''}
              ${addon?'<span class="badge-addon">ADD-ON</span>':''}
              <span style="font-size:13px;font-weight:700;color:${colorFor(item.category)}">${item.code}</span>
              ${item.modifiers.map(m=>`<span class="badge-mod">-${m}</span>`).join('')}
            </div>
            <div style="font-size:11px;color:#94a3b8;line-height:1.3">${item.description}</div>
          </div>
          <div style="text-align:right;margin-left:10px;flex-shrink:0">
            <div style="font-size:15px;font-weight:700;color:${idx>0&&!addon?'#94a3b8':'#38bdf8'}">${eff.toFixed(2)}</div>
            ${idx>0&&!addon?'<div class="reduction-note">50% reduct.</div>':''}
            <div style="font-size:8px;color:#334155">base: ${item.wrvu.toFixed(2)}</div>
          </div>
        </div>
        <div class="ctrl-row">
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="updateQty('${item.uid}',-1)">−</button>
            <span class="qty-val">${item.qty}</span>
            <button class="qty-btn" onclick="updateQty('${item.uid}',1)">+</button>
          </div>
          <button class="btn-mod-pick${isPicker?' open':''}" onclick="toggleModPicker('${item.uid}')">+ MOD</button>
          <div style="flex:1"></div>
          <button class="btn-remove" onclick="removeFromCase('${item.uid}')">✕</button>
        </div>
        ${isPicker?renderModPicker(item):''}
      </div>`;
    });
    html+=`<textarea class="case-notes" rows="2" placeholder="Case notes (patient, date, diagnosis, ICD-10…)" oninput="updateNotes(this.value)">${state.caseNotes}</textarea>
    <button class="btn-clear" onclick="clearCase()">✕ CLEAR CASE</button>`;
  }

  // Add panel
  html+=`<div class="add-panel">
    <div class="panel-title">ADD CODE TO CASE</div>

  ['All',...Object.keys(CATEGORY_COLORS)].forEach(cat=>{
    const active=state.builderCategory===cat;
    const color=colorFor(cat);
    html+=`<button class="pill" onclick="setBuilderCat('${cat}')" style="${active?`border-color:${color};background:${color}22;color:${color}`:''}"> ${cat}</button>`;
  });
  html+=`</div>
    <div class="search-wrap" style="margin-top:8px">
      <span class="search-icon">⌕</span>
      <input type="text" placeholder="Search code or procedure…" value="${state.builderSearch}" oninput="onBuilderSearch(this.value)" style="padding-left:34px">
    </div>
    <div class="add-results">`;
  getBuilderFiltered().forEach(item=>{
    const color=colorFor(item.category);

        <div style="font-size:8px;color:#334155">wRVU</div>
      </div>
    </div>`;
  });
  html+=`</div></div>
  <div class="disclaimer">* Est. at 2026 CF $68.87. -51 reduction (50%) on non-add-on secondary codes. Modifier -50 bilateral adds 50%. Actual reimbursement varies by payer contract.</div>`;

  content.innerHTML=html;
}

function renderModPicker(item){
  let html=`<div class="mod-picker">
    <div style="font-size:9px;color:#475569;letter-spacing:1px">MODIFIERS</div>
    <div class="mod-btns">`;
  SURGICAL_MODS.forEach(mc=>{
    const on=item.modifiers.includes(mc);
    html+=`<button class="mod-toggle${on?' on':''}" onclick="toggleMod2('${item.uid}','${mc}')">${mc}</button>`;
  });
  html+='</div>';
  if(item.modifiers.length>0){
    const modMap=Object.fromEntries(MODIFIERS.map(m=>[m.code,m]));
    item.modifiers.forEach(mc=>{
      if(modMap[mc]) html+=`<div style="font-size:9px;color:#64748b;margin-top:3px"><span style="color:#a78bfa">-${mc}</span> · ${modMap[mc].name}</div>`;
    });
  }
  html+='</div>';
  return html;
}

// ─── EVENT HANDLERS ──────────────────────────────────────────────────────────
function switchTab(tab){ state.tab=tab; state.expandedCode=null; state.expandedMod=null; render(); }
function onSearch(){ state.search=document.getElementById('search-input').value; render(); }
function setSort(s){ state.sort=s; render(); }
function toggleCard(code,desc){
  const key=code+'|'+desc;
  state.expandedCode=state.expandedCode===key?null:key;
  render();
}
function toggleMod(code){
  state.expandedMod=state.expandedMod===code?null:code;
  render();
}
function addToCase(code,desc){
  const item=CPT_DATA.find(d=>d.code===code&&d.description===desc)||CPT_DATA.find(d=>d.code===code);
  if(!item) return;
  state.caseItems.push({...item,modifiers:[],qty:1,uid:uid()});
  state.builderSearch='';
  render();
}
function removeFromCase(u){ state.caseItems=state.caseItems.filter(i=>i.uid!==u); state.modPickerUid=null; render(); }
function updateQty(u,delta){
  state.caseItems=state.caseItems.map(i=>i.uid===u?{...i,qty:Math.max(1,i.qty+delta)}:i);
  render();
}
function toggleModPicker(u){ state.modPickerUid=state.modPickerUid===u?null:u; render(); }
function toggleMod2(u,mc){
  state.caseItems=state.caseItems.map(i=>{
    if(i.uid!==u) return i;
    const has=i.modifiers.includes(mc);
    return{...i,modifiers:has?i.modifiers.filter(m=>m!==mc):[...i.modifiers,mc]};
  });
  render();
}
function clearCase(){ state.caseItems=[]; state.caseNotes=''; state.modPickerUid=null; render(); }
function updateNotes(v){ state.caseNotes=v; }
function setBuilderCat(cat){ state.builderCategory=cat; render(); }
function onBuilderSearch(v){ state.builderSearch=v; render(); }

// ─── INIT ────────────────────────────────────────────────────────────────────
render();
</script>
